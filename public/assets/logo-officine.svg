<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- Outer subtle delicate gold ring -->
  <circle cx="100" cy="100" r="96" stroke="#C7A363" stroke-width="1.2" stroke-opacity="0.8" stroke-dasharray="3 3"/>
  <circle cx="100" cy="100" r="91" stroke="#064D58" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="74" stroke="#C7A363" stroke-width="0.8" stroke-opacity="0.6"/>

  <!-- Circular curved text paths -->
  <defs>
    <path id="textPathTop" d="M 18,100 A 82,82 0 0,1 182,100" />
    <path id="textPathBottom" d="M 182,100 A 82,82 0 0,1 18,100" />
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CA8E" />
      <stop offset="50%" stop-color="#C7A363" />
      <stop offset="100%" stop-color="#9A7532" />
    </linearGradient>
  </defs>

  <!-- Circular typography -->
  <text font-family="'Instrument Serif', Georgia, serif" font-size="11.5" letter-spacing="3" fill="#064D58">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      L’OFFICINE DES ANGES
    </textPath>
  </text>

  <text font-family="Inter, -apple-system, sans-serif" font-size="7.5" font-weight="500" letter-spacing="3.5" fill="#7C8061">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      FABIENNE DIZY OLLIVEAUD
    </textPath>
  </text>

  <!-- Stars / Dots separators -->
  <circle cx="17" cy="100" r="1.5" fill="#C7A363" />
  <circle cx="183" cy="100" r="1.5" fill="#C7A363" />

  <!-- Center Emblem: Sculptural Angelic Silhouette + Botanical Olive / Lemniscate -->
  <!-- Subtle inner background disc -->
  <circle cx="100" cy="100" r="66" fill="#F7F2E8" fill-opacity="0.85" />

  <!-- Stylized Lemniscate + Wing Arch -->
  <g transform="translate(100, 100)" stroke="url(#goldGradient)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lemniscate base -->
    <path d="M -24,0 C -24,-14 -6,-14 0,0 C 6,14 24,14 24,0 C 24,-14 6,-14 0,0 C -6,14 -24,14 -24,0 Z" 
          fill="none" stroke-width="1.2" stroke-opacity="0.75" />
    
    <!-- Gentle angelic wings curving upward -->
    <path d="M -16,-4 C -22,-20 -12,-36 0,-40 C 12,-36 22,-20 16,-4" 
          fill="none" stroke-width="1.3" stroke="#064D58" stroke-opacity="0.9" />
    <path d="M -11,-8 C -16,-22 -7,-32 0,-34 C 7,-32 16,-22 11,-8" 
          fill="none" stroke-width="0.9" stroke="#C7A363" stroke-opacity="0.8" />

    <!-- Olive leaves motif on flanks -->
    <path d="M -30,-6 Q -38,-14 -32,-20 Q -24,-16 -24,-8 Z" fill="#7C8061" fill-opacity="0.6" stroke="none" />
    <path d="M 30,-6 Q 38,-14 32,-20 Q 24,-16 24,-8 Z" fill="#7C8061" fill-opacity="0.6" stroke="none" />
    <path d="M -24,8 Q -30,16 -24,20 Q -18,16 -20,8 Z" fill="#7C8061" fill-opacity="0.6" stroke="none" />
    <path d="M 24,8 Q 30,16 24,20 Q 18,16 20,8 Z" fill="#7C8061" fill-opacity="0.6" stroke="none" />

    <!-- Central star / droplet -->
    <circle cx="0" cy="-42" r="1.8" fill="#C7A363" stroke="none" />
    <path d="M 0,-46 L 0,-38 M -4,-42 L 4,-42" stroke="#C7A363" stroke-width="0.7" />
  </g>
</svg>
